name: CI

on:
  pull_request:
  push:
    branches-ignore: [main] # main is built by the deploy workflow

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: file:./dev.db
  SESSION_SECRET: ci-only-not-a-secret

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy # verifies migrations apply to the committed DB
      - run: npm run lint
      - run: npx tsc --noEmit
      - name: Build (server mode)
        run: npm run build
      - name: Build (static export, as deployed to GitHub Pages)
        env:
          STATIC_EXPORT: "true"
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: |
          node scripts/prepare-static-export.mjs
          npm run build
