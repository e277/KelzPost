name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: blog
          POSTGRES_PASSWORD: blog
          POSTGRES_DB: blog
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U blog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://blog:blog@localhost:5432/blog
      DATABASE_URL_UNPOOLED: postgresql://blog:blog@localhost:5432/blog
      SESSION_SECRET: ci-only-not-a-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci # also runs `prisma generate`
      - name: Check schema and migrations are in sync
        # Uses a separate scratch database: the shadow DB is left with the migrated schema.
        env:
          SHADOW_DATABASE_URL: postgresql://blog:blog@localhost:5432/blog_shadow
        run: |
          PGPASSWORD=blog psql -h localhost -U blog -d blog -c 'CREATE DATABASE blog_shadow'
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$SHADOW_DATABASE_URL" --exit-code
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
