<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Blog</title>
  <link rel="stylesheet" href="blog.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
</head>
<body>

  <header class="blog-header">
    <nav class="blog-nav">
      <a href="index.html" class="blog-logo" id="navLogo">
        <div class="blog-logo__mark" id="logoMark">J</div>
        <div class="blog-logo__text" id="logoText">The<span>Journal</span></div>
      </a>
      <div class="blog-nav__links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="admin.html" class="btn btn--primary btn--sm" style="margin-left:8px">Admin</a>
      </div>
    </nav>
  </header>

  <section class="blog-hero">
    <div class="blog-hero__content">
      <span class="blog-hero__tag">Personal Blog</span>
      <h1 class="blog-hero__title" id="heroTitle">The Journal</h1>
      <p class="blog-hero__sub" id="heroTagline">Thoughts, stories, and ideas — written to share.</p>
    </div>
  </section>

  <div class="blog-controls">
    <div class="blog-search">
      <svg class="blog-search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="Search articles…" />
    </div>
    <div class="blog-filter" id="filterButtons"></div>
  </div>

  <main class="blog-main">
    <div class="posts-grid" id="postsGrid"></div>
  </main>

  <footer class="site-footer" id="siteFooter"></footer>

  <script src="blog.js"></script>
  <script>
    const settings = getSettings();
    const posts    = getPosts().filter(p => p.status === 'published');

    // Apply settings to page
    document.title = settings.blogTitle + ' — Blog';
    document.getElementById('heroTitle').textContent   = settings.blogTitle;
    document.getElementById('heroTagline').textContent = settings.tagline;
    document.getElementById('logoMark').textContent    = (settings.blogTitle || 'J')[0].toUpperCase();
    document.getElementById('logoText').innerHTML      = settings.blogTitle.replace(/\s+(\S+)$/, '<span>$1</span>') || 'The<span>Journal</span>';

    // Build category filters from settings + post categories
    const postCats = [...new Set(posts.map(p => p.category).filter(Boolean))];
    const cats     = ['all', ...postCats];
    const filterEl = document.getElementById('filterButtons');
    filterEl.innerHTML = cats.map(c =>
      `<button class="filter-btn${c==='all'?' active':''}" data-cat="${c}">${c === 'all' ? 'All' : c}</button>`
    ).join('');

    let activeCat = 'all';
    let searchQ   = '';

    filterEl.addEventListener('click', e => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      activeCat = btn.dataset.cat;
      filterEl.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    });

    document.getElementById('searchInput').addEventListener('input', e => {
      searchQ = e.target.value.toLowerCase();
      render();
    });

    function renderCard(post, featured = false) {
      const img = post.coverImage
        ? `<img src="${post.coverImage}" alt="${post.title}" loading="lazy" />`
        : `<div class="post-card__image-placeholder"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" width="40" height="40"><rect x="4" y="8" width="40" height="32" rx="3"/><circle cx="18" cy="20" r="4"/><path d="m4 34 10-10 8 6 8-8 14 10"/></svg></div>`;

      return `
        <article class="post-card${featured ? ' post-card--featured' : ''}">
          <div class="post-card__image">
            ${img}
            ${post.category ? `<span class="post-card__category badge ${categoryBadgeClass(post.category, settings)}">${post.category}</span>` : ''}
          </div>
          <div class="post-card__body">
            <div class="post-card__meta">
              <span>${formatDate(post.publishedAt || post.createdAt)}</span>
              ${post.author ? `<span class="post-card__meta-dot"></span><span>${post.author}</span>` : ''}
            </div>
            <h2 class="post-card__title"><a href="post.html?id=${post.id}">${post.title}</a></h2>
            ${post.excerpt ? `<p class="post-card__excerpt">${post.excerpt}</p>` : ''}
            <div class="post-card__footer">
              <span class="post-card__author">By ${post.author || settings.authorName}</span>
              <a href="post.html?id=${post.id}" class="post-card__read-more">Read More →</a>
            </div>
          </div>
        </article>`;
    }

    function render() {
      const grid = document.getElementById('postsGrid');
      const filtered = posts.filter(p => {
        const matchCat    = activeCat === 'all' || p.category === activeCat;
        const matchSearch = !searchQ || p.title.toLowerCase().includes(searchQ) || (p.excerpt || '').toLowerCase().includes(searchQ);
        return matchCat && matchSearch;
      });

      if (!filtered.length) {
        grid.innerHTML = `<div class="posts-grid--empty">
          <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" width="48" height="48"><rect x="4" y="8" width="40" height="32" rx="3"/><path d="M16 24h16M16 30h10"/></svg>
          <p>${posts.length === 0 ? 'No posts yet. <a href="admin.html">Write your first post →</a>' : 'No articles match your search.'}</p>
        </div>`;
        return;
      }

      grid.innerHTML = filtered.map((post, i) => renderCard(post, i === 0 && filtered.length > 1)).join('');
    }

    render();
    renderSiteFooter('siteFooter', settings);
  </script>
</body>
</html>
