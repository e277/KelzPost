<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editor — Blog Admin</title>
  <link rel="stylesheet" href="blog.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
</head>
<body class="admin-body">

  <div class="admin-shell">

    <aside class="admin-sidebar">
      <div class="admin-sidebar__logo">
        <div class="blog-logo" id="sidebarLogo">
          <div class="blog-logo__mark" id="sidebarLogoMark">J</div>
          <div class="blog-logo__text" id="sidebarLogoText">The<span style="color:var(--gold)">Journal</span></div>
        </div>
      </div>
      <div class="admin-sidebar__label">Main Menu</div>
      <nav class="admin-sidebar__nav">
        <a href="admin.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Dashboard
        </a>
        <a href="editor.html" class="active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          New Post
        </a>
        <a href="settings.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Settings
        </a>
        <a href="index.html" target="_blank">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          View Blog
        </a>
      </nav>
      <div class="admin-sidebar__footer">
        <a href="#" id="logoutBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Sign Out
        </a>
      </div>
    </aside>

    <div class="admin-content">
      <div class="admin-topbar">
        <h1 class="admin-topbar__title" id="pageTitle">New Post</h1>
        <div class="admin-topbar__actions">
          <button class="btn btn--ghost btn--sm" id="saveDraftBtn">Save Draft</button>
          <button class="btn btn--primary btn--sm" id="publishBtn">Publish</button>
        </div>
      </div>

      <div class="admin-page">
        <div class="editor-layout">

          <!-- Main editor -->
          <div>
            <div class="editor-card" style="margin-bottom:20px">
              <div class="editor-card__body">
                <input type="text" id="postTitle" class="editor-title" placeholder="Post title…" />

                <div class="editor-toolbar" id="toolbar">
                  <button class="toolbar-btn" data-cmd="bold" title="Bold"><b>B</b></button>
                  <button class="toolbar-btn" data-cmd="italic" title="Italic"><i>I</i></button>
                  <button class="toolbar-btn" data-cmd="underline" title="Underline"><u>U</u></button>
                  <div class="toolbar-sep"></div>
                  <button class="toolbar-btn" data-cmd="h2" title="Heading 2">H2</button>
                  <button class="toolbar-btn" data-cmd="h3" title="Heading 3">H3</button>
                  <div class="toolbar-sep"></div>
                  <button class="toolbar-btn" data-cmd="insertUnorderedList" title="Bullet List">
                    <svg viewBox="0 0 20 20" fill="currentColor" width="14" height="14"><path d="M4 5a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm0 6a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm0 6a1 1 0 1 0 0-2 1 1 0 0 0 0 2zM7 4h10a1 1 0 0 1 0 2H7a1 1 0 0 1 0-2zm0 6h10a1 1 0 0 1 0 2H7a1 1 0 0 1 0-2zm0 6h10a1 1 0 0 1 0 2H7a1 1 0 0 1 0-2z"/></svg>
                  </button>
                  <button class="toolbar-btn" data-cmd="insertOrderedList" title="Numbered List">
                    <svg viewBox="0 0 20 20" fill="currentColor" width="14" height="14"><path d="M3 4h1v3H3V4zm0 5h1.5l-1.5 2h1.5v1H3v-1l1.5-2H3V9zm1 6H3v-1h2v4H3v-1h1v-2zM7 4h10a1 1 0 0 1 0 2H7a1 1 0 0 1 0-2zm0 6h10a1 1 0 0 1 0 2H7a1 1 0 0 1 0-2zm0 6h10a1 1 0 0 1 0 2H7a1 1 0 0 1 0-2z"/></svg>
                  </button>
                  <div class="toolbar-sep"></div>
                  <button class="toolbar-btn" data-cmd="blockquote" title="Blockquote">
                    <svg viewBox="0 0 20 20" fill="currentColor" width="14" height="14"><path d="M6 3a3 3 0 0 1 3 3v1a3 3 0 0 1-3 3H5a1 1 0 0 0 1 1h1a1 1 0 0 1 0 2H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3zm8 0a3 3 0 0 1 3 3v1a3 3 0 0 1-3 3h-1a1 1 0 0 0 1 1h1a1 1 0 0 1 0 2h-1a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3z"/></svg>
                  </button>
                  <button class="toolbar-btn" data-cmd="createLink" title="Insert Link">
                    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                  </button>
                  <button class="toolbar-btn" data-cmd="unlink" title="Remove Link">
                    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/><line x1="2" y1="2" x2="18" y2="18"/></svg>
                  </button>
                  <div class="toolbar-sep"></div>
                  <button class="toolbar-btn" data-cmd="removeFormat" title="Clear Formatting">
                    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M6 4l8 12M4 4h12"/></svg>
                  </button>
                </div>

                <div class="editor-area" id="editorArea" contenteditable="true" data-placeholder="Start writing your article here…"></div>
              </div>
            </div>
          </div>

          <!-- Sidebar -->
          <div class="sidebar-panel">

            <!-- Status -->
            <div class="editor-card">
              <div class="editor-card__header">Post Status</div>
              <div class="editor-card__body">
                <div class="form-group">
                  <label for="postStatus">Status</label>
                  <select id="postStatus">
                    <option value="draft">Draft</option>
                    <option value="published">Published</option>
                  </select>
                </div>
                <div class="form-group">
                  <label for="postAuthor">Author</label>
                  <input type="text" id="postAuthor" placeholder="Author name" />
                </div>
              </div>
            </div>

            <!-- Details -->
            <div class="editor-card">
              <div class="editor-card__header">Details</div>
              <div class="editor-card__body">
                <div class="form-group">
                  <label for="postCategory">Category</label>
                  <select id="postCategory">
                    <option value="">Select category…</option>
                  </select>
                </div>
                <div class="form-group">
                  <label for="postExcerpt">Excerpt</label>
                  <textarea id="postExcerpt" rows="3" placeholder="Short summary shown in listings…"></textarea>
                </div>
              </div>
            </div>

            <!-- Cover Image -->
            <div class="editor-card">
              <div class="editor-card__header">Cover Image</div>
              <div class="editor-card__body">

                <!-- Upload zone -->
                <div class="upload-zone" id="uploadZone">
                  <input type="file" id="coverFile" accept="image/*" />
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="32" height="32"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                  <p><strong>Click to upload</strong> or drag & drop<br>PNG, JPG, WEBP up to 5 MB</p>
                </div>

                <!-- Preview -->
                <div class="upload-preview-wrap" id="coverPreviewWrap">
                  <img id="coverPreviewImg" src="" alt="Cover preview" />
                  <button class="upload-preview-remove" id="removeCover" title="Remove image">✕</button>
                </div>

                <!-- URL fallback -->
                <span class="upload-url-toggle" id="urlToggle">Or use an image URL instead</span>
                <div class="upload-url-field" id="urlField">
                  <input type="url" id="coverUrl" placeholder="https://…" />
                </div>
              </div>
            </div>

            <!-- Danger zone -->
            <div class="editor-card" id="dangerCard" style="display:none">
              <div class="editor-card__header" style="color:var(--red)">Danger Zone</div>
              <div class="editor-card__body">
                <button class="btn btn--danger btn--sm btn--full" id="deletePostBtn">Delete This Post</button>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Delete confirm modal -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal">
      <h2 class="modal__title">Delete Post?</h2>
      <p class="modal__body">This will permanently delete this post. This cannot be undone.</p>
      <div class="modal__actions">
        <button class="btn btn--ghost" id="cancelDelete">Cancel</button>
        <button class="btn btn--danger" id="confirmDelete">Delete</button>
      </div>
    </div>
  </div>

  <script src="blog.js"></script>
  <script>
    requireAuth();

    const settings = getSettings();
    const editId   = getParam('id');
    let currentPost = null;
    let coverDataUrl = '';

    // Apply branding
    document.getElementById('sidebarLogoMark').textContent = (settings.blogTitle || 'J')[0].toUpperCase();
    document.getElementById('sidebarLogoText').innerHTML   = settings.blogTitle.replace(/\s+(\S+)$/, '<span style="color:var(--gold)">$1</span>') || 'The<span style="color:var(--gold)">Journal</span>';

    // Populate category dropdown from settings
    const catSelect = document.getElementById('postCategory');
    settings.categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = opt.textContent = c;
      catSelect.appendChild(opt);
    });

    // Set default author from settings
    document.getElementById('postAuthor').value = settings.authorName || 'Author';

    // Load post for editing
    if (editId) {
      currentPost = getPost(editId);
      if (currentPost) {
        document.getElementById('pageTitle').textContent  = 'Edit Post';
        document.getElementById('postTitle').value        = currentPost.title || '';
        document.getElementById('editorArea').innerHTML   = currentPost.content || '';
        document.getElementById('postStatus').value       = currentPost.status || 'draft';
        document.getElementById('postAuthor').value       = currentPost.author || settings.authorName;
        document.getElementById('postCategory').value     = currentPost.category || '';
        document.getElementById('postExcerpt').value      = currentPost.excerpt || '';
        document.getElementById('dangerCard').style.display = 'block';

        if (currentPost.coverImage) {
          coverDataUrl = currentPost.coverImage;
          showPreview(currentPost.coverImage);
          // If it's a URL (not base64), show in url field instead
          if (!currentPost.coverImage.startsWith('data:')) {
            document.getElementById('coverUrl').value = currentPost.coverImage;
            document.getElementById('urlField').style.display = 'block';
            document.getElementById('urlToggle').textContent  = 'Hide URL field';
          }
        }
      }
    }

    // ── COVER IMAGE ──
    const uploadZone    = document.getElementById('uploadZone');
    const coverFile     = document.getElementById('coverFile');
    const previewWrap   = document.getElementById('coverPreviewWrap');
    const previewImg    = document.getElementById('coverPreviewImg');

    // Drag & drop visual
    uploadZone.addEventListener('dragover',  e => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
    uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
    uploadZone.addEventListener('drop', e => {
      e.preventDefault(); uploadZone.classList.remove('drag-over');
      const file = e.dataTransfer.files[0];
      if (file) handleFile(file);
    });

    coverFile.addEventListener('change', () => {
      if (coverFile.files[0]) handleFile(coverFile.files[0]);
    });

    function handleFile(file) {
      if (!file.type.startsWith('image/')) { showToast('Please select an image file.', 'error'); return; }
      if (file.size > 5 * 1024 * 1024) { showToast('Image must be under 5 MB.', 'error'); return; }
      const reader = new FileReader();
      reader.onload = e => {
        coverDataUrl = e.target.result;
        showPreview(coverDataUrl);
        document.getElementById('coverUrl').value = '';
      };
      reader.readAsDataURL(file);
    }

    function showPreview(src) {
      previewImg.src        = src;
      previewWrap.style.display = 'block';
      uploadZone.style.display  = 'none';
    }

    document.getElementById('removeCover').addEventListener('click', () => {
      coverDataUrl = '';
      coverFile.value = '';
      previewImg.src  = '';
      previewWrap.style.display = 'none';
      uploadZone.style.display  = 'block';
      document.getElementById('coverUrl').value = '';
    });

    // URL toggle
    const urlToggle = document.getElementById('urlToggle');
    const urlField  = document.getElementById('urlField');
    urlToggle.addEventListener('click', () => {
      const open = urlField.style.display === 'block';
      urlField.style.display = open ? 'none' : 'block';
      urlToggle.textContent  = open ? 'Or use an image URL instead' : 'Hide URL field';
    });

    document.getElementById('coverUrl').addEventListener('input', e => {
      const url = e.target.value.trim();
      if (url) { coverDataUrl = url; showPreview(url); }
      else { coverDataUrl = ''; }
    });

    // ── TOOLBAR ──
    document.getElementById('toolbar').addEventListener('mousedown', e => {
      const btn = e.target.closest('.toolbar-btn');
      if (!btn) return;
      e.preventDefault();
      const cmd = btn.dataset.cmd;
      if (cmd === 'h2' || cmd === 'h3') document.execCommand('formatBlock', false, cmd);
      else if (cmd === 'blockquote')    document.execCommand('formatBlock', false, 'blockquote');
      else if (cmd === 'createLink') { const url = prompt('Enter URL:'); if (url) document.execCommand('createLink', false, url); }
      else document.execCommand(cmd, false, null);
      updateToolbarState();
    });

    document.getElementById('editorArea').addEventListener('keyup',   updateToolbarState);
    document.getElementById('editorArea').addEventListener('mouseup', updateToolbarState);

    function updateToolbarState() {
      document.querySelectorAll('.toolbar-btn[data-cmd]').forEach(btn => {
        try { btn.classList.toggle('active', document.queryCommandState(btn.dataset.cmd)); } catch {}
      });
    }

    // ── SAVE / PUBLISH ──
    function collectPost(status) {
      const title = document.getElementById('postTitle').value.trim();
      if (!title) { showToast('Please add a title.', 'error'); return null; }
      const now  = new Date().toISOString();
      const base = currentPost || {};
      return {
        id:          base.id || generateId(),
        title,
        slug:        slugify(title),
        excerpt:     document.getElementById('postExcerpt').value.trim(),
        content:     document.getElementById('editorArea').innerHTML,
        category:    document.getElementById('postCategory').value,
        coverImage:  coverDataUrl || '',
        status,
        author:      document.getElementById('postAuthor').value.trim() || settings.authorName,
        createdAt:   base.createdAt || now,
        updatedAt:   now,
        publishedAt: status === 'published' ? (base.publishedAt || now) : (base.publishedAt || null),
      };
    }

    document.getElementById('saveDraftBtn').addEventListener('click', () => {
      const post = collectPost('draft');
      if (!post) return;
      savePost(post); currentPost = post;
      document.getElementById('dangerCard').style.display = 'block';
      history.replaceState(null, '', `editor.html?id=${post.id}`);
      showToast('Draft saved.');
    });

    document.getElementById('publishBtn').addEventListener('click', () => {
      const post = collectPost('published');
      if (!post) return;
      savePost(post); currentPost = post;
      document.getElementById('postStatus').value = 'published';
      document.getElementById('dangerCard').style.display = 'block';
      history.replaceState(null, '', `editor.html?id=${post.id}`);
      showToast('Post published!');
    });

    // ── DELETE ──
    document.getElementById('deletePostBtn')?.addEventListener('click', () => {
      document.getElementById('deleteModal').classList.add('open');
    });
    document.getElementById('cancelDelete').addEventListener('click', () => {
      document.getElementById('deleteModal').classList.remove('open');
    });
    document.getElementById('confirmDelete').addEventListener('click', () => {
      if (currentPost) { deletePost(currentPost.id); window.location.href = 'admin.html'; }
    });
    document.getElementById('deleteModal').addEventListener('click', e => {
      if (e.target === document.getElementById('deleteModal')) document.getElementById('deleteModal').classList.remove('open');
    });

    document.getElementById('logoutBtn').addEventListener('click', e => {
      e.preventDefault(); logout(); window.location.href = 'admin.html';
    });

    window.addEventListener('beforeunload', e => {
      if (document.getElementById('postTitle').value || document.getElementById('editorArea').textContent.trim()) {
        e.preventDefault(); e.returnValue = '';
      }
    });
  </script>

</body>
</html>
