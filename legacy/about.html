<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About</title>
  <link rel="stylesheet" href="blog.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
</head>
<body>

  <header class="blog-header">
    <nav class="blog-nav">
      <a href="index.html" class="blog-logo" id="navLogo">
        <div class="blog-logo__mark" id="logoMark">J</div>
        <div class="blog-logo__text" id="logoText">The<span>Journal</span></div>
      </a>
      <div class="blog-nav__links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="admin.html" class="btn btn--primary btn--sm" style="margin-left:8px">Admin</a>
      </div>
    </nav>
  </header>

  <main>
    <div class="about-wrapper" id="aboutContent">
      <!-- Rendered by JS -->
    </div>
  </main>

  <footer class="site-footer" id="siteFooter"></footer>

  <script src="blog.js"></script>
  <script>
    const settings = getSettings();

    document.title = `${settings.aboutTitle || 'About'} — ${settings.blogTitle}`;
    document.getElementById('logoMark').textContent = (settings.blogTitle || 'J')[0].toUpperCase();
    document.getElementById('logoText').innerHTML    = settings.blogTitle.replace(/\s+(\S+)$/, '<span>$1</span>') || 'The<span>Journal</span>';

    const avatar = settings.authorAvatar
      ? `<img src="${settings.authorAvatar}" alt="${settings.authorName}" class="about-avatar" />`
      : `<div class="about-avatar-placeholder">${(settings.authorName || 'A')[0].toUpperCase()}</div>`;

    const bio = settings.authorBio
      ? `<p class="about-bio">${settings.authorBio}</p>`
      : '';

    const body = settings.aboutContent
      ? `<div class="about-body">${settings.aboutContent}</div>`
      : `<div class="about-empty">Nothing here yet — add some content from the admin Settings page.</div>`;

    document.getElementById('aboutContent').innerHTML = `
      <div class="about-header">
        ${avatar}
        <h1 class="about-title">${settings.aboutTitle || 'About'}</h1>
        <p class="about-name">${settings.authorName}</p>
        ${bio}
      </div>
      ${body}
    `;

    renderSiteFooter('siteFooter', settings);
  </script>
</body>
</html>
